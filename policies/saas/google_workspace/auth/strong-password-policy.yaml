id: gws-auth-002
name: Strong password policy enforced
description: |
  Enforce a minimum password length of at least 12 characters, require
  Google's password strength check, and prevent reuse of the last 5 passwords.

enabled: true
severity: medium

resource_type: gws_tenant_security

check:
  type: expression
  expression: "resource.password_strength_enforced == true and resource.password_min_length >= 12 and resource.password_reuse_prevention >= 5"

compliance:
  - framework: cis-google-workspace-foundations
    version: "1.0.0"
    control: "1.1"
  - framework: nist-800-53
    version: "rev5"
    control: "IA-5(1)"

remediation:
  guidance: |
    1. Admin Console → Security → Authentication → Password management
    2. Set "Enforce strong password" = on
    3. Set minimum length to 12 (or higher)
    4. Enable password reuse prevention with history >= 5

tags:
  - google-workspace
  - authentication
  - password-policy
