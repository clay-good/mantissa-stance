id: m365-apps-003
name: Service principal secrets and certs are rotated and time-bound
description: |
  Every service-principal credential must have an expiration set, must not
  be expired, and must not be due for expiration within 30 days without an
  acknowledged rotation plan. Long-lived or non-expiring secrets are the
  most common single source of M365 lateral-movement findings.

enabled: true
severity: high

resource_type: entra_service_principal

check:
  type: expression
  expression: "resource.has_credential_without_expiry == false and resource.credentials_expired == 0"

compliance:
  - framework: cis-microsoft-365-foundations
    version: "3.0.0"
    control: "5.1.7"
  - framework: nist-800-53
    version: "rev5"
    control: "IA-5"

remediation:
  guidance: |
    1. For each SP listed: generate a new secret/cert with an explicit
       expiry (12 months max)
    2. Update the consuming application
    3. Delete the old credential
    Stance secrets-inventory will alert at 30/14/7 days going forward.

tags:
  - microsoft-365
  - entra
  - service-principal
  - secret-rotation
