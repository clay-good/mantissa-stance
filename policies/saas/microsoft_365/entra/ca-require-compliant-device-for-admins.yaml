id: m365-entra-004
name: Conditional Access requires compliant device for admin sign-ins
description: |
  At least one enabled CA policy must require a compliant (or hybrid-joined)
  device for users in privileged directory roles. Device compliance is the
  highest-signal binding stance can verify and is the practical answer to
  AiTM phishing kits that already harvest the auth cookie.

enabled: true
severity: high

resource_type: entra_ca_summary

check:
  type: expression
  expression: "resource.any_policy_requires_compliant_device_for_admins == true"

compliance:
  - framework: cis-microsoft-365-foundations
    version: "3.0.0"
    control: "1.1.3"

remediation:
  guidance: |
    Conditional Access → New policy:
      Users: directory roles (privileged)
      Cloud apps: All
      Grant: Require device to be marked as compliant
              OR Require Hybrid Azure AD joined device

tags:
  - microsoft-365
  - entra
  - conditional-access
  - device-compliance
