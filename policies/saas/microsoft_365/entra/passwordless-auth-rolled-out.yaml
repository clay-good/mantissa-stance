id: m365-entra-009
name: Passwordless authentication is rolled out
description: |
  At least one passwordless authentication method (FIDO2, Windows Hello,
  Microsoft Authenticator phone sign-in, or passkey) must be enabled
  tenant-wide. Without one, the only step-up factor is SMS or app push,
  both of which are bypassable by current AiTM kits.

enabled: true
severity: medium

resource_type: entra_auth_methods_summary

check:
  type: expression
  expression: "resource.any_passwordless_enabled == true"

compliance:
  - framework: cis-microsoft-365-foundations
    version: "3.0.0"
    control: "1.1.9"

remediation:
  guidance: |
    Entra admin → Protection → Authentication methods → Policies:
      Enable FIDO2 security keys, Windows Hello for Business, or
      passkey-capable Microsoft Authenticator.

tags:
  - microsoft-365
  - entra
  - passwordless
  - mfa
