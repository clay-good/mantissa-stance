id: m365-entra-003
name: Conditional Access requires MFA for admin sign-ins
description: |
  At least one enabled CA policy must require MFA for users in privileged
  directory roles. Admins are the highest-value sign-in target and the
  baseline must enforce MFA explicitly rather than rely on per-user MFA.

enabled: true
severity: critical

resource_type: entra_ca_summary

check:
  type: expression
  expression: "resource.any_policy_requires_mfa_for_admins == true"

compliance:
  - framework: cis-microsoft-365-foundations
    version: "3.0.0"
    control: "1.1.2"
  - framework: nist-800-53
    version: "rev5"
    control: "IA-2(1)"

remediation:
  guidance: |
    Conditional Access → New policy:
      Users: include directory roles (Global Admin, Privileged Role Admin, ...)
      Cloud apps: All
      Grant: Require MFA

tags:
  - microsoft-365
  - entra
  - conditional-access
  - admin
  - mfa
