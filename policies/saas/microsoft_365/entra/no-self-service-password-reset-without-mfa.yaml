id: m365-entra-010
name: SSPR requires MFA
description: |
  If self-service password reset is enabled, it must require MFA. SSPR
  without MFA is a recurring SOC1 finding because it converts an SMS code
  into a full account takeover.

enabled: true
severity: high

resource_type: entra_auth_methods_summary

check:
  type: expression
  expression: "resource.sspr_enabled == false or resource.sspr_requires_mfa == true"

compliance:
  - framework: cis-microsoft-365-foundations
    version: "3.0.0"
    control: "1.1.10"

remediation:
  guidance: |
    Entra admin → Protection → Password reset → Authentication methods:
      Set "Number of methods required to reset" = 2

tags:
  - microsoft-365
  - entra
  - sspr
  - mfa
