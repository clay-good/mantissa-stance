id: asm-shadow-005
name: Asset on residential or dynamic IP range
description: 'Detects assets hosted on IP addresses in residential or dynamic

  IP ranges, which may indicate development/test environments

  exposed from home networks or unauthorized hosting.

  '
enabled: true
severity: medium
resource_type: external_asset
check:
  type: expression
  expression: 'resource.cloud_provider exists or

    resource.raw_data.ip_type != "residential"

    '
remediation:
  guidance: "1. Identify the purpose and owner of this asset\n2. Assets on residential\
    \ IPs are typically:\n   - Developer test environments\n   - Unauthorized hosting\n\
    \   - Misconfigured DNS\n3. If the asset is legitimate:\n   - Migrate to proper\
    \ cloud or datacenter hosting\n   - Ensure it does not expose sensitive data\n\
    4. If unauthorized:\n   - Decommission immediately\n   - Review DNS management\
    \ access\n   - Update security policies\n"
  automation_supported: false
tags:
- residential
- dynamic-ip
- shadow-it
- asm
references:
- https://www.cloudflare.com/learning/dns/dns-security/
