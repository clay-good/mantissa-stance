id: asm-dns-001
name: Dangling CNAME record detected
description: |
  Detects DNS CNAME records pointing to non-existent resources.
  Dangling DNS records can lead to subdomain takeover attacks where
  an attacker claims the orphaned resource.

enabled: true
severity: high

resource_type: external_asset

check:
  type: expression
  expression: |
    resource.raw_data.is_dangling != true

remediation:
  guidance: |
    1. Identify what the CNAME was originally pointing to
    2. If the target resource is no longer needed:
       - Remove the CNAME record from DNS
    3. If the target resource should exist:
       - Re-create the resource with the same name
       - Or update the CNAME to point to the correct resource
    4. Document the reason for the change
    5. Audit other DNS records for similar issues
  automation_supported: false

tags:
  - dns
  - cname
  - dangling
  - takeover
  - asm

references:
  - https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/02-Configuration_and_Deployment_Management_Testing/10-Test_for_Subdomain_Takeover
  - https://developer.mozilla.org/en-US/docs/Web/Security/Subdomain_takeovers

---

id: asm-dns-002
name: Subdomain takeover vulnerability
description: |
  Detects subdomains vulnerable to takeover attacks. This occurs when
  a DNS record points to a service that can be claimed by an attacker,
  such as unclaimed cloud resources, expired SaaS tenants, or
  deprovisioned CDN endpoints.

enabled: true
severity: critical

resource_type: external_asset

check:
  type: expression
  expression: |
    resource.raw_data.takeover_vulnerable != true

remediation:
  guidance: |
    CRITICAL: Subdomain takeover allows attackers to serve malicious content
    from your domain, enabling phishing, cookie theft, and reputation damage.

    1. Immediately verify the vulnerability
    2. If the target service is still needed:
       - Re-claim the resource (S3 bucket, GitHub Pages, etc.)
    3. If the service is no longer needed:
       - Remove the DNS record immediately
    4. Do NOT wait - attackers actively scan for these vulnerabilities
    5. Audit all DNS records for similar issues
    6. Implement monitoring for new dangling records

    Common vulnerable services:
    - AWS S3 buckets
    - Azure App Services
    - GitHub Pages
    - Heroku apps
    - CloudFront distributions
    - Shopify stores
  automation_supported: false

tags:
  - dns
  - subdomain-takeover
  - critical
  - vulnerability
  - asm

references:
  - https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/02-Configuration_and_Deployment_Management_Testing/10-Test_for_Subdomain_Takeover
  - https://github.com/EdOverflow/can-i-take-over-xyz

