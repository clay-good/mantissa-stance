id: asm-dns-003
name: Missing SPF record
description: |
  Detects domains without an SPF (Sender Policy Framework) record.
  SPF helps prevent email spoofing by specifying which servers are
  authorized to send email for your domain.

enabled: true
severity: medium

resource_type: external_asset

check:
  type: expression
  expression: |
    resource.raw_data.records not_exists or
    resource.raw_data.spf_record exists

remediation:
  guidance: |
    1. Identify all servers that send email for your domain
    2. Create an SPF record in DNS:
       v=spf1 include:_spf.google.com include:amazonses.com -all
    3. Start with ~all (softfail) for testing
    4. Move to -all (hardfail) after verification
    5. Keep SPF record under 10 DNS lookups
    6. Test using online SPF validators
  automation_supported: false

tags:
  - dns
  - spf
  - email
  - spoofing
  - asm

references:
  - https://www.cloudflare.com/learning/dns/dns-records/dns-spf-record/
  - https://tools.ietf.org/html/rfc7208

---

id: asm-dns-004
name: Missing DMARC record
description: |
  Detects domains without a DMARC (Domain-based Message Authentication)
  record. DMARC builds on SPF and DKIM to provide email authentication
  and reporting.

enabled: true
severity: medium

resource_type: external_asset

check:
  type: expression
  expression: |
    resource.raw_data.records not_exists or
    resource.raw_data.dmarc_record exists

remediation:
  guidance: |
    1. Ensure SPF and DKIM are configured first
    2. Create a DMARC record at _dmarc.yourdomain.com:
       v=DMARC1; p=none; rua=mailto:dmarc-reports@yourdomain.com
    3. Start with p=none (monitoring only)
    4. Review reports and fix issues
    5. Move to p=quarantine then p=reject
    6. Consider DMARC reporting services for large volumes
  automation_supported: false

tags:
  - dns
  - dmarc
  - email
  - spoofing
  - asm

references:
  - https://dmarc.org/overview/
  - https://tools.ietf.org/html/rfc7489

