id: asm-cert-005
name: Self-signed certificate detected
description: |
  Detects self-signed certificates on publicly accessible services.
  Self-signed certificates cause browser warnings and cannot be
  verified by trusted certificate authorities.

enabled: true
severity: medium

resource_type: external_asset

check:
  type: expression
  expression: |
    resource.certificate_info not_exists or
    resource.certificate_info.is_self_signed != true

remediation:
  guidance: |
    1. Obtain a certificate from a trusted certificate authority
    2. For public services, use a well-known CA (Let's Encrypt, DigiCert, etc.)
    3. For internal services, consider an internal PKI or private CA
    4. Replace the self-signed certificate with the trusted certificate
    5. Ensure the full certificate chain is installed

    Note: Self-signed certificates may be acceptable for:
    - Development environments
    - Internal-only services with proper trust configuration
  automation_supported: false

tags:
  - certificate
  - ssl
  - tls
  - self-signed
  - asm

references:
  - https://letsencrypt.org/getting-started/

---

id: asm-cert-006
name: Certificate SAN mismatch with domain
description: |
  Detects certificates where the Subject Alternative Names (SANs)
  do not include the domain being accessed. This can cause
  browser security warnings.

enabled: true
severity: medium

resource_type: external_asset

check:
  type: expression
  expression: |
    resource.certificate_info not_exists or
    resource.domain in resource.certificate_info.san_domains

remediation:
  guidance: |
    1. Request a new certificate that includes all required domains
    2. Ensure the domain is listed in Subject Alternative Names (SANs)
    3. For wildcard certificates, verify the wildcard matches the subdomain level
    4. Note: *.example.com does NOT match sub.sub.example.com
    5. Install the corrected certificate
  automation_supported: false

tags:
  - certificate
  - ssl
  - tls
  - san
  - mismatch
  - asm

references:
  - https://www.digicert.com/faq/public-trust-and-certificates/what-is-a-san-ssl-certificate
