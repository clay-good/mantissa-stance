id: asm-cert-003
name: Certificate uses weak algorithm
description: |
  Detects certificates using weak cryptographic algorithms such as
  SHA-1 or MD5. These algorithms are considered cryptographically
  broken and should not be used for SSL/TLS certificates.

enabled: true
severity: high

resource_type: external_asset

check:
  type: expression
  expression: |
    resource.certificate_info not_exists or
    (not (resource.certificate_info.signature_algorithm contains "sha1") and
     not (resource.certificate_info.signature_algorithm contains "md5"))

remediation:
  guidance: |
    1. Request a new certificate with SHA-256 or stronger signature algorithm
    2. Most modern CAs use SHA-256 by default
    3. If using an internal CA, ensure it is configured for SHA-256
    4. Replace the weak certificate with the new SHA-256 certificate
    5. Verify the new certificate signature algorithm
  automation_supported: false

tags:
  - certificate
  - ssl
  - tls
  - weak-algorithm
  - sha1
  - md5
  - asm

references:
  - https://www.ssl.com/article/sha-256-signature-algorithm/
  - https://nvd.nist.gov/vuln/detail/CVE-2019-0009

---

id: asm-cert-004
name: Certificate key size insufficient
description: |
  Detects certificates with RSA key sizes smaller than 2048 bits.
  Keys smaller than 2048 bits are considered weak and may be
  vulnerable to factorization attacks.

enabled: true
severity: high

resource_type: external_asset

check:
  type: expression
  expression: |
    resource.certificate_info not_exists or
    resource.certificate_info.key_algorithm != "RSA" or
    resource.certificate_info.key_size >= 2048

remediation:
  guidance: |
    1. Generate a new private key with at least 2048-bit RSA or 256-bit ECDSA
    2. Create a new CSR with the stronger key
    3. Submit CSR to your certificate authority
    4. Install the new certificate with the stronger key
    5. Recommended key sizes:
       - RSA: 2048 bits minimum, 4096 bits preferred
       - ECDSA: 256 bits (P-256) or 384 bits (P-384)
  automation_supported: false

tags:
  - certificate
  - ssl
  - tls
  - key-size
  - weak-key
  - asm

references:
  - https://www.keylength.com/en/4/
  - https://nvd.nist.gov/vuln/detail/CVE-2017-14100

