id: asm-shadow-005
name: Asset on residential or dynamic IP range
description: |
  Detects assets hosted on IP addresses in residential or dynamic
  IP ranges, which may indicate development/test environments
  exposed from home networks or unauthorized hosting.

enabled: true
severity: medium

resource_type: external_asset

check:
  type: expression
  expression: |
    resource.cloud_provider exists or
    resource.raw_data.ip_type != "residential"

remediation:
  guidance: |
    1. Identify the purpose and owner of this asset
    2. Assets on residential IPs are typically:
       - Developer test environments
       - Unauthorized hosting
       - Misconfigured DNS
    3. If the asset is legitimate:
       - Migrate to proper cloud or datacenter hosting
       - Ensure it does not expose sensitive data
    4. If unauthorized:
       - Decommission immediately
       - Review DNS management access
       - Update security policies
  automation_supported: false

tags:
  - residential
  - dynamic-ip
  - shadow-it
  - asm

references:
  - https://www.cloudflare.com/learning/dns/dns-security/
