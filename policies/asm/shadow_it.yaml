id: asm-shadow-001
name: Asset not in CSPM inventory
description: |
  Detects externally discovered assets that are not present in the
  internal CSPM inventory. These shadow IT assets represent unknown
  or unmanaged infrastructure that may not comply with security policies.

enabled: true
severity: high

resource_type: external_asset

check:
  type: expression
  expression: |
    resource.raw_data.cspm_matched == true or
    resource.raw_data.correlation_checked != true

remediation:
  guidance: |
    1. Investigate the discovered asset to determine:
       - Who created it and why
       - What data or services it exposes
       - Whether it follows security policies
    2. If the asset is legitimate:
       - Add it to your CSPM inventory
       - Ensure proper security controls are applied
       - Document the owner and purpose
    3. If the asset is unauthorized:
       - Determine if it should be decommissioned
       - Transfer to managed infrastructure if needed
       - Address with the team that created it
    4. Update asset management processes to prevent recurrence
  automation_supported: false

tags:
  - shadow-it
  - inventory
  - unmanaged
  - cspm
  - asm

references:
  - https://www.gartner.com/en/information-technology/glossary/shadow-it

---

id: asm-shadow-002
name: Asset in unexpected cloud provider
description: |
  Detects assets hosted by a cloud provider that is not part of
  the organization's approved infrastructure. This may indicate
  shadow IT or unauthorized cloud usage.

enabled: true
severity: medium

resource_type: external_asset

check:
  type: expression
  expression: |
    resource.cloud_provider not_exists or
    resource.raw_data.expected_cloud_providers not_exists or
    resource.cloud_provider in resource.raw_data.expected_cloud_providers

remediation:
  guidance: |
    1. Identify who deployed the asset in the unexpected cloud provider
    2. Determine the business justification for using this provider
    3. Evaluate security implications:
       - Does the provider meet security requirements?
       - Is data properly protected?
       - Are compliance requirements met?
    4. Options:
       - Migrate to an approved cloud provider
       - Add the provider to the approved list with proper controls
       - Decommission if not needed
    5. Update cloud governance policies as needed
  automation_supported: false

tags:
  - shadow-it
  - cloud-provider
  - unexpected
  - governance
  - asm

references:
  - https://www.cisecurity.org/controls

---

id: asm-shadow-003
name: New subdomain detected since last scan
description: |
  Detects new subdomains that were not present in previous scans.
  New subdomains may represent new services that need security review,
  or potentially unauthorized deployments.

enabled: true
severity: info

resource_type: external_asset

check:
  type: expression
  expression: |
    resource.first_seen != resource.last_seen or
    resource.raw_data.is_new_asset != true

remediation:
  guidance: |
    1. This is an informational finding for new asset awareness
    2. Verify the new subdomain is expected:
       - Check with development and infrastructure teams
       - Review deployment logs and tickets
    3. Ensure the new service:
       - Has proper security controls
       - Is included in vulnerability scanning
       - Has appropriate access controls
       - Is documented in asset inventory
    4. Set up monitoring for the new asset
  automation_supported: false

tags:
  - subdomain
  - new-asset
  - change-detection
  - asm

references:
  - https://owasp.org/www-project-web-security-testing-guide/

---

id: asm-shadow-004
name: Service running on non-standard port
description: |
  Detects services running on non-standard ports. While sometimes
  intentional, this can indicate misconfiguration or attempts
  to evade security controls.

enabled: true
severity: low

resource_type: external_asset

check:
  type: expression
  expression: |
    resource.port not_exists or
    resource.service not_exists or
    not ((resource.service == "http" and resource.port != 80) or
         (resource.service == "https" and resource.port not_in [443, 8443]) or
         (resource.service == "ssh" and resource.port != 22) or
         (resource.service == "mysql" and resource.port != 3306) or
         (resource.service == "postgresql" and resource.port != 5432))

remediation:
  guidance: |
    1. Verify the non-standard port is intentional
    2. Common reasons for non-standard ports:
       - Security by obscurity (not recommended as sole control)
       - Running multiple services on same host
       - Container or development environments
    3. If intentional:
       - Document the reason
       - Ensure firewall rules are appropriate
       - Update monitoring to cover the non-standard port
    4. If unintentional:
       - Reconfigure to use standard ports
       - Update documentation and monitoring
  automation_supported: false

tags:
  - port
  - non-standard
  - configuration
  - asm

references:
  - https://www.iana.org/assignments/service-names-port-numbers/service-names-port-numbers.xhtml

